@version: 4.5
@include "scl.conf"

# ESPHome `syslog` sends one UDP packet per log line in the classic BSD format:
#   <134>Nov  3 07:12:03 esphome-remodo remodox: [8C:14:7D:31:49:BB] [stats] ...
source s_esphome {
  udp(ip(0.0.0.0) port(5514));
};

# One file per device and day. Time = receive time on this server (the ESP has no time before SNTP sync).
destination d_esphome {
  file("/var/log/remodo/${HOST}/${R_YEAR}-${R_MONTH}-${R_DAY}.log"
       create-dirs(yes)
       template("${R_ISODATE} ${LEVEL} ${PROGRAM}: ${MESSAGE}\n"));
};

log {
  source(s_esphome);
  destination(d_esphome);
};
